name: Sync LeetCode

on:
  workflow_dispatch:
  schedule:
    # Check every 30 minutes. GitHub may delay scheduled workflows slightly.
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Sync accepted LeetCode solutions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python scripts/sync_leetcode.py

      - name: Commit and push new solutions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add problems/
          if git diff --cached --quiet; then
            echo "No new LeetCode solutions to commit."
            exit 0
          fi
          git commit -m "[LeetCode Sync] Add accepted solutions"
          git push
